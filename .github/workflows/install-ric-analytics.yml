name: Install RIC Analytics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/install-ric-analytics.yml']
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install canonical client
        env:
          PAGE_ID: guia-saude-mental
          PRIVACY: health
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path('index.html')
          if not p.exists(): raise SystemExit('index.html ausente')
          s=p.read_text(encoding='utf-8')
          if 'ric-analytics-page' not in s:
              block=f'''\n<meta name="ric-analytics-page" content="{os.environ['PAGE_ID']}">\n<meta name="ric-analytics-privacy" content="{os.environ['PRIVACY']}">\n<script src="https://ricmurtapsicologia.github.io/RPD/assets/js/ric-analytics.js?v=1.0.0" defer></script>\n'''
              if '</head>' not in s: raise SystemExit('</head> ausente')
              p.write_text(s.replace('</head>',block+'</head>',1),encoding='utf-8')
          PY
          rm -f .github/workflows/install-ric-analytics.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add privacy-safe RIC analytics client'
          git push
